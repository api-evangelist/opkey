openapi: 3.1.0
info:
  title: pCloudy Device Cloud API
  version: v2
  summary: Public REST API for the pCloudy real-device cloud, an Opkey product.
  description: 'The pCloudy REST API is the machine-readable surface of the pCloudy real-device testing cloud operated by
    Opkey (Smart Software Testing Solutions Inc.). It covers authentication, device booking and session lifecycle, app upload/install/control,
    device interaction, performance capture, session media and logs, network simulation, APK instrumentation, app resigning,
    App Center integration, and Appium/XCTest automation orchestration. All methods default to POST except authentication,
    and requests set Content-Type: application/json.


    PROVENANCE: this document was generated by API Evangelist from the operations, parameters and examples published in Opkey''s
    own public pCloudy API Reference at https://content.pcloudy.com/apidocs/ . Opkey does not publish an OpenAPI document;
    every path, method, parameter and description here is transcribed from that published reference and nothing has been invented.
    It is a third-party transcription, not a provider artifact.'
  contact:
    name: Opkey
    url: https://www.opkey.com/
  x-generated-by: API Evangelist enrichment pipeline
  x-source: https://content.pcloudy.com/apidocs/
externalDocs:
  description: pCloudy API Reference
  url: https://content.pcloudy.com/apidocs/
servers:
- url: https://{cloud}.pcloudy.com
  description: pCloudy cloud instance
  variables:
    cloud:
      default: device
      enum:
      - device
      - demo
      - aus
      description: pCloudy cloud host prefix; the docs refer to this as <Cloud URL>.
tags:
- name: Authentication
- name: Generic
- name: Session Media & Logs
- name: App Control
- name: Performance
- name: Device Interaction
- name: Appium Automation
- name: Xctest Automation
- name: Network Simulation
- name: File Management
- name: Device Booking & Session
- name: Apk Instrumentation
- name: App Resigning
- name: Resigning Apis
- name: Apk Instrumentation Apis
- name: App Center Api
paths:
  /api/access:
    get:
      operationId: authentication
      summary: Authentication
      tags:
      - Authentication
      description: Authenticates the API user with Basic auth (username:API key) and returns an access token used to authorize
        all subsequent API calls. This is the first call in any automation flow; the returned token is sent in the header
        of the other endpoints.
      parameters:
      - name: email
        in: query
        description: your email id
        schema:
          type: string
      - name: accessKey
        in: query
        description: your access key (you will get it from Account Settings->API)
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - basicAuth: []
  /api/v2/generic/kill-app:
    post:
      operationId: killApp
      summary: Kill App
      tags:
      - Generic
      description: Force-stops (kills) the specified application on the reserved device, immediately terminating its process
        and any background activity. Use it to reset an app to a clean state between test steps or to recover from a hung/unresponsive
        app without uninstalling it. The app stays installed and can be relaunched afterwards.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - packageName
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                packageName:
                  type: string
                  description: Android application package name.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: 0C7GnIt4TrS9xgS70lrqr
                requestId: O8WLCAFzLWW1HoBSKQFcU
                statusCode: 200
                status: success
                message: App killed successfully
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/generic/uninstall-app:
    post:
      operationId: uninstallApp
      summary: Uninstall App(V2)
      tags:
      - Generic
      description: Uninstalls the specified application from the reserved device, removing the app binary together with its
        locally stored data and cache. Typically used during teardown or before installing a fresh build to guarantee a clean
        install. The app must be reinstalled before it can be used again.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - packageName
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                packageName:
                  type: string
                  description: Android application package name.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: oVaUsQXEa91HNWMNIaEOo
                requestId: Int9rwc7JSyWwUBA4hM8h
                statusCode: 200
                status: success
                message: App uninstalled successfully
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/generic/geo-ip-location:
    post:
      operationId: geoIpLocation
      summary: Geo IP Location - Connect
      tags:
      - Generic
      description: Routes the reserved device's traffic through a selected Geo-IP location so the device appears to browse
        from another country/region. Used to validate geo-targeted behaviour such as localized content, currency, language,
        and geo-restrictions. Pair with the disconnect call to restore the default route.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - countryName
              - action
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                countryName:
                  type: string
                  description: Target country for Geo-IP simulation.
                action:
                  type: string
                  description: '"connect" or "disconnect".'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: moNs111FHexL1yJOGne
                requestId: CI17h3RIHl5zMP7npE6
                statusCode: 200
                status: success
                message: Geo Ip Location Changed Successfully
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/generic/init-liveview:
    post:
      operationId: startStreamer
      summary: Start Streamer
      tags:
      - Generic
      description: Initializes the live-view video streamer for the reserved device, starting the real-time screen stream
        used to view and interact with the device remotely. Used at the start of an interactive session to begin streaming
        the device screen.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: p6i8FFON1EaaSiRZ3te
                requestId: 3iKTFULPxb871bRmJE1
                statusCode: 200
                status: success
                message: started kickStartStreamer
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/generic/set-location:
    post:
      operationId: setLocation
      summary: Set Mock GPS Location
      tags:
      - Generic
      description: Sets a mock GPS location on the device using the supplied latitude and longitude, overriding the real location.
        Used to test location-aware features such as maps, geofencing, and location-based content by placing the device at
        any coordinates.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - latitude
              - longitude
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                latitude:
                  type: number
                  description: GPS latitude of the mock location.
                longitude:
                  type: number
                  description: GPS longitude of the mock location.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: xCmEBrTYSnm1p0RFOVMT
                requestId: T700EF2wVlmFWwFNwX23
                statusCode: 200
                status: success
                message: Set location set successfully
                data:
                  isOk: true
                  statusCode: 200
                  data:
                    statusCode: 200
                    message: Location set successfully
                err: null
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/generic/set-timezone:
    post:
      operationId: setTimezone
      summary: Set Time Zone (iOS)
      tags:
      - Generic
      description: Sets the device system timezone to the supplied value. Used to test time-zone-dependent behaviour such
        as schedules, timestamps, daylight-saving handling, and localized date/time formatting.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - timezone
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                timezone:
                  type: string
                  description: Timezone name (e.g., "Chennai").
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: QuuvW6Uk5Fu79ZExVMOX
                requestId: FA3GMyRn5G2qBaxBAC3P
                statusCode: 200
                status: success
                message: Set timezone successfully
                data:
                  isOk: true
                  statusCode: 200
                  data:
                    statusCode: 200
                    message: Timezone set successfully
                err: null
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/download/session-video:
    post:
      operationId: downloadSessionVideo
      summary: Downloaded Session Video(V2)
      tags:
      - Session Media & Logs
      description: Generates a time-limited signed URL from which the session screen-recording video can be downloaded. Call
        it once the upload has completed (see the upload-progress API) to obtain a direct, shareable link to the recorded
        video for the session.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: bLS6gc77E4EA8LGIzh
                requestId: IDkHKxwC00kQ5S9gp6X
                statusCode: 200
                status: success
                message: Signed video URL generated successfully
                data:
                  signedUrl: https://pcloudy-observability-stg.s3.eu-west-2.amazonaws.com/privado/178/39955/video-Pixel3XL_2026_May_11_10_01_am__193-1778494404733.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256&...
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/device-logs-download:
    post:
      operationId: deviceLogsDownload
      summary: Device_logs_download(V2)
      tags:
      - Session Media & Logs
      description: Collects the device logs captured during the session (logcat on Android, syslog on iOS) and returns them
        as a downloadable log file. Use it to retrieve runtime, warning, and diagnostic output for debugging test failures
        after the session ends.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/video-record:
    post:
      operationId: enableVideoRecord
      summary: Enable Video Record
      tags:
      - Session Media & Logs
      description: Starts screen-video recording of the session on the reserved device. Use it to capture a video of the test
        run for evidence or debugging; stop it with the disable-video-record call, after which the video can be uploaded and
        downloaded.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enableRecord
              - rid
              properties:
                enableRecord:
                  type: boolean
                  description: true to start, false to stop recording.
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: PqKUQk4IU40k3YgApYg
                requestId: GftB7PLMq1p8rJltIXV
                statusCode: 200
                status: success
                message: OK
                data:
                - message: Session video recording started successfully
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/crash-logs-download:
    post:
      operationId: crashLogsDownload
      summary: Crash Logs Download — iOS
      tags:
      - Session Media & Logs
      description: Collects the iOS crash reports generated during the session and returns them as a downloadable file. Used
        to investigate app crashes captured on the device, providing the crash stack and diagnostic logs for debugging.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/session-video/upload-progress:
    post:
      operationId: videoUploadProgress
      summary: Video Upload progress(V2)
      tags:
      - Session Media & Logs
      description: Returns the current upload progress of the session screen-recording video as it is transferred to pCloudy
        storage. Poll this endpoint after a recorded session to know when the video has finished uploading and is ready to
        download, and to drive a progress indicator in the UI.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: hjiudSYlT2JiSf11vny
                requestId: BBRMIoC1z6ZoMwERm5k
                statusCode: 200
                status: success
                message: Session video upload progress fetched successfully
                data:
                  rid: 39955
                  status: completed
                  progress: 100
                  progressPercentage: 100
                  bytesReceived: 11754978
                  totalBytes: 11754978
                  startedAt: 1778493784657
                  updatedAt: 1778493791947
                  completedAt: 1778493791947
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/check-app-installed:
    post:
      operationId: checkAppInstalled
      summary: Check App Installed Via Bundle ID
      tags:
      - App Control
      description: Checks whether an application identified by its bundle id is currently installed on a reserved iOS device,
        returning a true/false result. Use it as a precondition before launching or installing, to avoid redundant installs
        and to branch test logic on app presence. iOS only.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - appIdentifier
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                appIdentifier:
                  type: string
                  description: Application bundle/package identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: W0PvAMlrHPgMW5jCgQi
                requestId: 6mNcLhXLrb2XyLXPJKx
                statusCode: 200
                status: success
                message: App installation status fetched successfully
                data:
                  status: true
                  isInstalled: true
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/install-app:
    post:
      operationId: installApp
      summary: Install App
      tags:
      - App Control
      description: Installs an application build onto the reserved device using the V2 flow, from a file already uploaded
        to the pCloudy drive. Used to deploy the app under test before launching it; it does not launch the app by itself.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - filename
              - appInstallOnly
              - trustApp
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                filename:
                  type: string
                  description: Application file name (APK/IPA).
                appInstallOnly:
                  type: boolean
                  description: true to install without launching.
                trustApp:
                  type: boolean
                  description: true to trust developer profile (iOS).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: JBSWeoDhE58OjvrqTg4
                statusCode: 200
                status: success
                message: apk/ipa installed successfully
                data:
                  bundleId: com.pcloudy.demo
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/start-transaction:
    post:
      operationId: startTransaction
      summary: Start Transaction
      tags:
      - Performance
      description: Starts a named performance transaction on the device to measure a discrete user flow, optionally enabling
        HAR network capture for the transaction window. Used to mark the beginning of a segment for which performance metrics
        (and network traffic) should be collected; close it with the stop-transaction call.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - packageName
              - transactionName
              - start
              - enableHARLogging
              - launchApp
              - isAutomation
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                packageName:
                  type: string
                  description: Android application package name.
                transactionName:
                  type: string
                  description: Performance transaction name.
                start:
                  type: boolean
                  description: true to start, false to stop the transaction.
                enableHARLogging:
                  type: boolean
                  description: true to capture HAR network logs.
                launchApp:
                  type: boolean
                  description: true to launch the app.
                isAutomation:
                  type: boolean
                  description: true if run under automation.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: QkNmNIxnUgbxjsCbOfU
                requestId: Ft3PQBMIZFcwlCextEqd8
                statusCode: 200
                status: success
                message: Transaction Operation successful
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/start_performance_data:
    post:
      operationId: startPerformance
      summary: Start Performance Data
      tags:
      - Generic
      description: This API helps to start the performance data of the app under testing. You will get battery, CPU, memory,
        internet and frame rendering data on Android device and for iOS you will get the CPU, memory and network packets under
        testing on that device. This data is stored in cloud drive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - rid
              - pkg
              properties:
                token:
                  type: string
                  description: Authtoken (this will get from authenticate response)
                rid:
                  type: string
                  description: Reservation id (will get from book device api response)
                pkg:
                  type: string
                  description: App package name (will get from install and launch api response)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/manual_access_files_list:
    post:
      operationId: performanceFileList
      summary: Performance Data File List
      tags:
      - Generic
      description: This API helps to get the performance data file names which are stored in cloud drive of a particular device.
        You will get battery, CPU, memory, internet and frame rendering data files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - rid
              properties:
                token:
                  type: string
                  description: Authtoken (this will get from authenticate response)
                rid:
                  type: string
                  description: Reservation id (will get from book device api response)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/download_manual_access_data:
    post:
      operationId: downloadPerformance
      summary: Download Performance Data
      tags:
      - Generic
      description: This api help to download the performance data file from cloud drive to your local system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - rid
              - filename
              properties:
                token:
                  type: string
                  description: Authtoken (this will get from authenticate response)
                rid:
                  type: string
                  description: Reservation id (will get from book device api response)
                filename:
                  type: string
                  description: performance data file name (will get from performance data file list api response)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid access token
      security:
      - accessToken: []
  /api/v2/send-text:
    post:
      operationId: sendText
      summary: Send Text
      tags:
      - Device Interaction
      description: Types the supplied text into the currently focused input field on the device, simulating keyboard entry.
        Used to fill forms, search boxes, and login fields during automation without invoking a full Appium driver.
      parameters:
      - name: token
        in: header
        required: true
        description: API access token (from /api/access).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              - text
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                text:
                  type: string
                  description: Text to type on the device.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                traceId: rvvl8cZniTjpOZc3PjML
