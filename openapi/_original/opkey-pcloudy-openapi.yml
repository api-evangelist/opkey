            schema:
              type: object
              required:
              - rid
              - uploadData
              - downloadData
              properties:
                rid:
                  type: integer
                  description: Device reservation ID (returned when the device is booked).
                uploadData:
                  type: integer
                  description: Upload bandwidth limit (kbps).
                downloadData:
                  type: integer
                  description: Download bandwidth limit (kbps).
      responses:
        '200':
          description: Successful response
          content:
