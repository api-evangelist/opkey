      error: string (present on failure)
      token: string (on /api/access)
  correlation_fields: []
  note: Failures are commonly returned inside result.error with a 200 status line; callers must inspect the body,
    not the status code.
problems:
- status: 401
  title: Unauthorized
  detail: Missing, expired or invalid access token in the `token` header (or `token` body field on legacy paths).
  remediation: Re-mint a token with GET /api/access using HTTP Basic (email + access key). The pCloudy MCP server
    caches tokens for 5 days and re-authenticates on rejection.
  source_operation: openapi/opkey-pcloudy-openapi.yml (all 90 operations declare 401)
- status: 200
  title: Envelope-level error (legacy)
  detail: Legacy /api/* operations can return HTTP 200 with result.error set; the transport status is not the outcome.
  remediation: Always read result.error before treating a legacy call as successful.
  source_operation: openapi/opkey-pcloudy-openapi.yml#authentication
