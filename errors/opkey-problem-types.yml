note: 'pCloudy does not use RFC 9457 problem+json. Two envelopes are in play. The newer /api/v2/* operations return
  {traceId, requestId, statusCode, status, message}; `status` carries success/OK on the happy path and the failure
  text otherwise, and traceId/requestId are the correlation handles to quote in support. The legacy /api/* operations
  wrap everything in {"result": {...}} and surface failures as result.error with an HTTP 200. The published reference
  documents no error-code registry, so there is no enumerable catalog to harvest — these are the shapes, not a code
  list.'
envelopes:
- id: v2
  applies_to: /api/v2/* operations
  shape:
    traceId: string
    requestId: string
    statusCode: integer
    status: string
    message: string
  correlation_fields:
  - traceId
