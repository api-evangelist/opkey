summary: 'Binds every tool published by the pCloudy MCP server to the pCloudy REST operation(s) that back it. The
  bindings are not guessed by name: the MCP package ships an explicit PcloudyApiEndpoints table, so each device/app
  tool resolves to a named REST path. The divergence is the story — 26 of 36 tools reach two backends (Browser Cloud
  and QPilot) that have no counterpart in the public REST reference, and 79 of 90 documented REST operations have
  no tool at all.'
