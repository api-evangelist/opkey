    file: openapi/opkey-pcloudy-openapi.yml
    operations: 90
    note: Transcribed by API Evangelist from the published pCloudy API Reference; Opkey publishes no OpenAPI document.
  graphql: null
  mcp:
    package: pcloudy-mcp
    transport: stdio
    gated: true
    note: stdio-only and credential-gated, so tools/list cannot be introspected anonymously; the tool set was read
      from the published wheel.
