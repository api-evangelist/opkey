authentication:
  style: environment variables consumed by the stdio server
  variables:
  - name: PCLOUDY_USERNAME
    description: pCloudy account username / email.
  - name: PCLOUDY_API_KEY
    description: pCloudy API access key from Account Settings -> API.
  - name: PCLOUDY_CLOUD_URL
    description: Cloud URL of the pCloudy instance, e.g. https://device.pcloudy.com.
  note: The server exchanges username + API key for an access token against GET /api/access (the same endpoint the
    REST API uses) and caches it locally.
