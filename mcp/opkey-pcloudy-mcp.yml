- name: create_qpilot_playground_session
  description: Create a QPilot playground session for a specific test. Requires test id to specify which test to
    create a session for. You can get the test list using the get_qpilot_tests tool. (*mandatory) Requires platform
    information to know which platform to run the session on. All platforms <android/ios/web> (*mandatory) For mobile
    platforms (android/ios), requires device id to know which device to run the session on. You can get the device
    list using the get_device_list tool. (*mandatory for mobile) For web platform, requires vm_id, browser name(only
    chrome allowed) and browser version to know which browser to run the session on. You can get these from the
    get_browser_list tool. (*mandatory for web)
  group: QPilot AI test authoring
