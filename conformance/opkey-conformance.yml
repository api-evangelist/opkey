standards:
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in the spec and no OAuth flow documented; auth is HTTP Basic to mint a bearer-style
    access token passed in a `token` header.
- id: oidc
  conforms: false
  evidence: No /.well-known/openid-configuration on any host (404/302/catch-all).
- id: http-basic-auth
  conforms: true
  evidence: GET /api/access authenticates with RFC 7617 HTTP Basic (email:accessKey).
- id: rfc9457-problem-details
  conforms: false
  evidence: No application/problem+json responses; errors are returned in the vendor JSON envelope (statusCode/status/message,
    or result.error on legacy paths).
- id: rest-json
  conforms: true
  evidence: 'Resource-oriented URLs, Content-Type: application/json on requests, JSON responses, per the published
    API reference.'
- id: idempotency-keys
  conforms: false
  evidence: No Idempotency-Key header or equivalent documented on any of the 90 operations.
- id: pagination
  conforms: false
  evidence: No cursor/offset pagination convention; list operations take a `limit` on /api/drive only.
- id: webhooks
  conforms: false
  evidence: No webhook catalog published; QPilot pushes step events over an internal WebSocket, not a documented
    subscriber-facing event surface.
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document published on any host or in the GitHub org.
- id: mcp
  conforms: true
  evidence: Official pcloudy-mcp server (PyPI 0.1.4) exposing 36 tools over stdio; released in pCloudy 8.5.
- id: a2a
  conforms: false
  evidence: No agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host; the two 200s observed
    were HTML catch-alls and were rejected.
- id: webdriver-appium
  conforms: true
  evidence: pCloudy exposes an Appium/WebDriver hub endpoint (https://device.pcloudy.com/appiumcloud/wd/hub) and
    documents desired capabilities.
