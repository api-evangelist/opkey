apis:
- aid: opkey:pcloudy-api
  name: pCloudy Device Cloud API
  description: 'The public REST API for pCloudy, the real-device mobile and browser
    testing cloud operated by Opkey. It follows resource-oriented URLs, defaults every
    method to POST except authentication, and returns JSON. Coverage spans authentication
    and access tokens, device listing/booking/release and session lifecycle, app upload
    to the cloud drive, install/launch/kill/uninstall, device interaction (tap, swipe,
    text, rotate, home, ADB), session media and logs (screenshots, video, device and
    crash logs), app and device performance capture, network simulation profiles,
    APK instrumentation, iOS app resigning, App Center integration, and Appium and
    XCTest automation orchestration.'
  humanURL: https://www.pcloudy.com/docs/api-reference/
  baseURL: https://device.pcloudy.com
