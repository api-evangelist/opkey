aid: opkey
name: Opkey
description: 'Opkey (Smart Software Testing Solutions, Inc.) is a US-headquartered
  Cloud Application Lifecycle Management and AI-powered test automation vendor for
  enterprise packaged applications. Its no-code platform ships pre-built automated
  tests and change-impact analysis for Oracle Cloud/EBS, Workday, Salesforce, SAP,
  Coupa, Veeva, UKG/Kronos and Microsoft Dynamics, alongside an agentic layer (Argus
  AI, Testing/Configuration/Training/Impact-Analysis/PMO agents, Release Advisor and
  Maestro). Opkey also operates pCloudy, the real-device mobile and browser testing
  cloud it acquired, which carries the company''s public developer surface: a documented
  REST API for device booking, app upload/install, device interaction, performance
  capture, network simulation, Appium/XCTest orchestration and APK instrumentation,
  plus a published pCloudy MCP server that exposes device booking, app management and
  QPilot AI test authoring as tools to MCP clients. The core Opkey product help and
  user guides sit behind a customer login; the pCloudy documentation, API reference
  and release notes are public.'
