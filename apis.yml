apis:
- aid: opkey:pcloudy-mcp
  name: pCloudy MCP Server
  description: >-
    The official pCloudy MCP server, published by pCloudy as the Python package pcloudy-mcp and run over
    stdio with uvx. It exposes 36 tools across four groups — device booking, browser booking, app management,
    and QPilot AI test authoring — letting an MCP client list and book real devices and browsers, upload,
    install and resign apps, create projects/folders/tests, drive a QPilot playground session in natural-language
    steps, and manage test data. Authentication is by pCloudy username plus API key supplied as environment
    variables; the server mints and caches an access token against the same /api/access endpoint the REST
    API uses.
  humanURL: https://www.pcloudy.com/docs/mcp-server/
  baseURL: https://device.pcloudy.com
  tags:
  - MCP
  - Agents
  - Test Automation
